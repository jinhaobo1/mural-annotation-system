<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的任务 - 壁画结构化语义标注系统</title><link rel="stylesheet" href="assets/shared.css"></head><body data-page="my-tasks">
<div class="page-head">
  <div><h1>我的任务</h1><p>只显示管理员分配给当前审核员的任务。进入任务后直接审核 AI Candidate，无需从样本列表寻找。</p></div>
</div>
<div class="grid cols-4">
  <div class="card metric"><div class="label">待开始</div><div class="value" id="mWait">0</div><div class="sub">REVIEW_ASSIGNED</div></div>
  <div class="card metric"><div class="label">审核中</div><div class="value" id="mRun">0</div><div class="sub">IN_REVIEW</div></div>
  <div class="card metric"><div class="label">已提交专家</div><div class="value" id="mDone">0</div><div class="sub">本账号任务</div></div>
  <div class="card metric"><div class="label">当前账号</div><div class="value" style="font-size:18px" id="mUser">reviewer_01</div><div class="sub">标注审核员</div></div>
</div>
<div class="card card-pad" style="margin-top:14px">
  <h2 class="section-title">分配给我的任务</h2>
  <div id="myTaskList"></div>
</div>
<div id="toast" class="toast"></div><script src="assets/shared.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>setTimeout(renderMine,0));
function renderMine(){
 const user=currentUser(),all=getWorkflowTasks().filter(t=>t.reviewer===user),root=document.getElementById("myTaskList");
 document.getElementById("mUser").textContent=user;document.getElementById("mWait").textContent=all.filter(t=>t.status==="REVIEW_ASSIGNED").length;document.getElementById("mRun").textContent=all.filter(t=>t.status==="IN_REVIEW").length;document.getElementById("mDone").textContent=all.filter(t=>["REVIEWED","EXPERT_REVIEW","EXPERT_REVIEWED","ADMIN_ACCEPTANCE","APPROVED"].includes(t.status)).length;
 root.innerHTML=all.map(t=>`<div class="task-card"><div class="row"><div><div class="title">${t.id} · ${t.name}</div><div class="meta">${t.sample_count} 条 · 截止 ${t.due} · 专家审核员 ${t.expert}</div></div><div class="spacer"></div><span class="badge ${t.priority==='高'?'orange':'blue'}">${taskStatusLabel(t.status)}</span></div><div class="task-progress" style="margin-top:9px"><span class="${workflowStageIndex(t.status)>0?'done':'active'}">AI</span><span class="${workflowStageIndex(t.status)>1?'done':workflowStageIndex(t.status)===1?'active':''}">审核员</span><span>专家</span><span>管理员</span></div><div class="row" style="margin-top:10px"><span style="font-size:10px;color:#667085">进度 ${t.progress}/${t.sample_count}</span><div class="spacer"></div>${["REVIEW_ASSIGNED","IN_REVIEW"].includes(t.status)?`<button class="btn small primary" onclick="startTask('${t.id}')">${t.status==="REVIEW_ASSIGNED"?"开始审核":"继续审核"}</button>`:'<span class="badge green">已提交</span>'}</div></div>`).join("")||'<div class="panel-empty">当前没有分配给你的任务</div>'
}
function startTask(id){const tasks=getWorkflowTasks(),t=tasks.find(x=>x.id===id);if(t&&t.status==="REVIEW_ASSIGNED"){t.status="IN_REVIEW";saveWorkflowTasks(tasks)}setActiveTask(id);location.href="review.html"}
</script>
</body></html>
